name: PsySupabase CI

on:
  push:
    branches: [ psy-supabase-pkg ]
  pull_request:
    branches: [ psy-supabase-pkg ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install all dependencies
      run: |
        # Setup Python environment properly first
        if [[ "${{ matrix.python-version }}" == "3.8" ]]; then
          python -m pip install --upgrade pip wheel "setuptools<60.0.0"
        else
          python -m pip install --upgrade pip wheel setuptools
        fi

        # Install your package in development mode
        pip install -e .

        # Install all dependencies from requirements.txt (including school_logging)
        pip install -r requirements.txt

        # Install spacy language model
        python -m spacy download en_core_web_sm

        # Verify important dependencies
        python -c "import school_logging; print('✓ school_logging imported successfully')"

    - name: Setup Supabase environment
      run: |
        # Set up environment variables for Supabase
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
        echo "USER_ID=${{ secrets.USER_ID }}" >> $GITHUB_ENV

    - name: Install and verify school_logging
      run: |
        # Install the dependency
        pip install git+https://github.com/vertok/school_logging.git@main#egg=school-logging

        # Verify it's installed correctly
        python -c "import pkg_resources; print(pkg_resources.get_distribution('school-logging').version)"

        # Check the module structure
        python -c "import pkgutil; print([p for p in pkgutil.iter_modules() if 'school' in p.name])"

        # Try importing the specific module that's failing
        python -c "import importlib; print(dir(importlib.import_module('school_logging')))"

        # If the module is actually called something else, show what's available
        pip show school-logging

    - name: Install package in development mode
      run: |
        # Make sure the package is installed before running tests
        pip install -e .
        # Verify our own package has the right structure
        python -c "import pkgutil; print([p for p in pkgutil.iter_modules() if 'psy' in p.name])"
    
    - name: Run tests
      run: |
        # Run tests with more verbosity to see what's failing
        pytest -v

    - name: Build package
      run: |
        pip install build
        python -m build

    - name: Store build artifacts
      uses: actions/upload-artifact@c7d193f32edcb7bfad88892161225aeda64e9392  # v4.0.0
      with:
        name: dist-${{ matrix.python-version }}
        path: dist/
        retention-days: 7
