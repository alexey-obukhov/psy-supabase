name: PsySupabase CI

on:
  push:
    branches: [ psy-supabase-pkg ]
  pull_request:
    branches: [ psy-supabase-pkg ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10"]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup NLP environment
      run: |
        # Install packages based on Python version
        if [[ "${{ matrix.python-version }}" == "3.8" ]]; then
          # For Python 3.8 - use older compatible versions
          pip install nltk==3.8.1
          pip install numpy==1.24.4  # Force install compatible numpy first
          pip install --no-build-isolation --only-binary=:all: spacy==3.5.4
          pip install text2emotion==0.0.5
        else
          # For Python 3.10+ - use newer versions
          pip install nltk spacy text2emotion
        fi

        # Download required models
        python -c "import spacy; spacy.cli.download('en_core_web_sm')"
        python -c "import nltk; nltk.download('punkt'); nltk.download('stopwords'); nltk.download('wordnet')"

    - name: Install dependencies (consolidated)
      run: |
        # Set up pip with proper cache
        python -m pip install --upgrade pip wheel setuptools

        if [[ "${{ matrix.python-version }}" == "3.8" ]]; then
          # For Python 3.8 - stricter constraints
          pip install numpy==1.22.4  # Known compatible version for Python 3.8
        else
          # For Python 3.10 - more flexibility
          pip install numpy==1.24.4
        fi

        # Install pre-built spaCy wheel to avoid compilation issues
        pip install --no-build-isolation --only-binary=:all: spacy==3.6.1

        # Install remaining dependencies with constraints
        pip install python-dotenv

        # Install remaining requirements, but skip already installed packages
        pip install -r requirements.txt

        # Install school-logging explicitly
        pip install git+https://github.com/vertok/school_logging.git@main#egg=school-logging

        # Install your package in development mode
        pip install -e .

    - name: Install transformer packages
      run: |
        # Clear any cached transformer packages
        pip uninstall -y transformers sentence-transformers

        # Install the specific versions from your requirements.txt
        pip install transformers==4.46.3
        pip install sentence-transformers==3.2.1

        # Verify installed versions
        python -c "import transformers; import sentence_transformers; print(f'Transformers version: {transformers.__version__}'); print(f'Sentence-transformers version: {sentence_transformers.__version__}')"

        # Check if is_torch_npu_available exists
        python -c "import transformers; print('is_torch_npu_available exists:', hasattr(transformers, 'is_torch_npu_available'))"

    - name: Setup Supabase environment
      run: |
        # Set up environment variables for Supabase
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
        echo "USER_ID=${{ secrets.USER_ID }}" >> $GITHUB_ENV

    - name: Test with pytest
      continue-on-error: true
      id: pytest
      run: |
        # Install pytest dependencies
        pip install pytest pytest-cov exceptiongroup pluggy

        # Create directory for test results
        mkdir -p junit

        # Ensure we're using the correct transformers version (don't downgrade)
        pip install torch==2.0.1 # Install specific PyTorch version

        # Check transformers version - don't reinstall to avoid downgrade
        python -c "import transformers; print(f'Using transformers version {transformers.__version__}')"

        # Create HF cache directory
        mkdir -p ~/.cache/huggingface

        # Setup HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE for fallback
        echo "HF_HUB_OFFLINE=1" >> $GITHUB_ENV
        echo "TRANSFORMERS_OFFLINE=1" >> $GITHUB_ENV

        # Try to pre-download common models used in tests
        echo "Downloading models for offline use..."
        python -c "from transformers import AutoTokenizer, AutoModel; AutoTokenizer.from_pretrained('roberta-base', local_files_only=False); AutoModel.from_pretrained('roberta-base', local_files_only=False)" || echo "Model download failed, will try to use cached versions"

        # Load patch directly before running tests (more reliable than bashrc approach)
        echo "Patching transformers for offline testing..."
        python -c "
        import os
        import sys
        import transformers.utils.hub

        # Store original method
        original_cached_file = transformers.utils.hub.cached_file

        # Define patched method
        def patched_cached_file(*args, **kwargs):
            try:
                return original_cached_file(*args, **kwargs)
            except OSError as e:
                if 'offline mode' in str(e):
                    print(f'Creating mock data for {args[0]}')
                    return {'model_type': 'roberta', 'hidden_size': 768}
                raise e

        # Apply patch immediately
        transformers.utils.hub.cached_file = patched_cached_file
        print('Successfully patched transformers.utils.hub.cached_file')
        " || echo "Failed to patch transformers"

        # Run pytest with coverage and generate reports
        echo "Running pytest with coverage..."
        python -m pytest tests/ --cov=psy_supabase --cov-report=xml:coverage.xml --cov-report=html:htmlcov --junitxml=junit/test-results.xml || echo "::set-output name=pytest_failed::true"

        # Check if coverage.xml exists and create a minimal one if not
        if [ ! -f coverage.xml ]; then
          echo "Creating minimal coverage.xml"
          echo '<?xml version="1.0" ?><coverage version="5.5" timestamp="1619599074" lines-valid="100" lines-covered="0" line-rate="0"><sources><source>/home/runner/work/psy-supabase/psy-supabase</source></sources></coverage>' > coverage.xml
        fi

    - name: Test Summary
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ steps.pytest.outputs.pytest_failed }}" == "true" ]]; then
          echo "⚠️ Some tests failed, but pipeline continued" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}-${{ github.run_id }}
        path: |
          junit/test-results.xml
          htmlcov/
          coverage.xml

    - name: Create reports directory
      run: mkdir -p reports

    - name: Generate coverage badge
      run: |
        # First check if coverage.xml exists and has content
        if [ -s coverage.xml ]; then
          echo "Using existing coverage.xml"

          # Try with python to extract the line-rate attribute
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          import os

          try:
              root = ET.parse('coverage.xml').getroot()
              line_rate = root.get('line-rate')
              if line_rate is None:
                  print('0.0')
              else:
                  print(line_rate)
          except Exception as e:
              print('0.0')  # Default to 0 on any error
          ")
        else
          echo "No valid coverage data found"
          COVERAGE="0.0"
        fi

        # Calculate percentage and handle errors
        COVERAGE_PCT=$(python -c "
        try:
            print(round(float('${COVERAGE}') * 100, 2))
        except:
            print(0.0)
        ")

        echo "COVERAGE_PCT=$COVERAGE_PCT" >> $GITHUB_ENV
        echo "## Test Coverage: $COVERAGE_PCT%" >> $GITHUB_STEP_SUMMARY

        # Create a badge JSON file for shields.io
        COLOR=$(python -c "
        try:
            coverage = float('$COVERAGE_PCT')
            print('red' if coverage < 50 else 'yellow' if coverage < 80 else 'green')
        except:
            print('red')
        ")

        echo "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"$COVERAGE_PCT%\", \"color\": \"$COLOR\"}" > reports/coverage-badge.json

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}-${{ github.run_id }}
        path: reports/coverage-badge.json

    - name: Run pylint
      continue-on-error: true
      run: |
        pip install pylint
        pylint psy_supabase --output-format=text > reports/pylint-report.txt || true
        PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' reports/pylint-report.txt)
        echo "PYLINT_SCORE=$PYLINT_SCORE" >> $GITHUB_ENV
        echo "## PyLint Score: $PYLINT_SCORE/10" >> $GITHUB_STEP_SUMMARY
        # Create a badge JSON file for shields.io
        echo "{\"schemaVersion\": 1, \"label\": \"pylint-py${{ matrix.python-version }}\", \"message\": \"$PYLINT_SCORE/10\", \"color\": \"blue\"}" > reports/pylint-badge.json

    # Generate pylint badge SVG with Python version in filename
    - name: Generate pylint badge SVG
      run: |
        pip install anybadge
        PYLINT_SCORE="${PYLINT_SCORE:-0.0}"
        PYLINT_SCORE=$(echo "$PYLINT_SCORE" | sed -E 's/^[[:space:]]*$|^$/0.0/')
        anybadge --label="pylint-py${{ matrix.python-version }}" --value=$PYLINT_SCORE --file=reports/pylint-py${{ matrix.python-version }}.svg --suffix=/10 3=red 5=orange 8=yellow 10=green

    # Generate coverage badge SVG with Python version in filename
    - name: Generate coverage badge SVG
      run: |
        pip install anybadge
        COVERAGE_PCT="${COVERAGE_PCT:-0.0}"
        COVERAGE_PCT=$(echo "$COVERAGE_PCT" | sed -E 's/^[[:space:]]*$|^$/0.0/')
        anybadge --label="coverage-py${{ matrix.python-version }}" --value=$COVERAGE_PCT --file=reports/coverage-py${{ matrix.python-version }}.svg --suffix=% 50=red 60=orange 80=yellow 100=green

    # Upload badge artifacts with Python version in artifact name
    - name: Upload badge artifacts
      uses: actions/upload-artifact@v4
      with:
        name: badges-py${{ matrix.python-version }}-${{ github.sha }}
        path: |
          reports/pylint-py${{ matrix.python-version }}.svg
          reports/coverage-py${{ matrix.python-version }}.svg

    - name: Create reports directories
      run: |
        mkdir -p reports/health_check
        mkdir -p reports/db_debug
        mkdir -p reports/real_data_tests

    - name: Run health check
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Create log file for health check with appropriate Python version
        python${{ matrix.python-version }} health_check.py 2>&1 | tee reports/health_check/results.log
        # Extract summary information
        echo "## Health Check Summary (Python ${{ matrix.python-version }})" > reports/health_check/summary.md
        grep -E 'CUDA|Python|Platform|Memory' reports/health_check/results.log >> reports/health_check/summary.md || true
        echo "Health check completed at $(date)" >> reports/health_check/summary.md
        # Add to GitHub step summary
        cat reports/health_check/summary.md >> $GITHUB_STEP_SUMMARY

    - name: Run database debug
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Create log file for database debug with appropriate Python version
        python${{ matrix.python-version }} debug_database.py 2>&1 | tee reports/db_debug/results.log
        # Extract summary information
        echo "## Database Debug Summary (Python ${{ matrix.python-version }})" > reports/db_debug/summary.md
        grep -E 'Connection|Schema|Tables|Records|Query' reports/db_debug/results.log >> reports/db_debug/summary.md || true
        echo "Database debug completed at $(date)" >> reports/db_debug/summary.md
        # Add to GitHub step summary
        cat reports/db_debug/summary.md >> $GITHUB_STEP_SUMMARY

    - name: Run real data tests
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        # Check transformers version first
        python${{ matrix.python-version }} -c "import transformers, sys; print(f'Python {sys.version}'); print(f'Transformers {transformers.__version__}')"

        cd test_real_data
        mkdir -p ../reports/real_data_tests
        # Create summary file
        echo "## Real Data Tests Results (Python ${{ matrix.python-version }})" > ../reports/real_data_tests/summary.md
        echo "| Test File | Status | Duration | Notes |" >> ../reports/real_data_tests/summary.md
        echo "|-----------|--------|----------|-------|" >> ../reports/real_data_tests/summary.md

        # Run each test and collect results
        for test_file in test_*.py; do
          echo "Running $test_file using Python ${{ matrix.python-version }}"
          test_name=$(basename "$test_file" .py)
          log_file="../reports/real_data_tests/${test_name}_py${{ matrix.python-version }}.log"
          start_time=$(date +%s)

          # Run test with timing and capture output - using correct Python version
          if python${{ matrix.python-version }} "$test_file" > "$log_file" 2>&1; then
            status="✅ Passed"
            notes=""
          else
            status="❌ Failed"
            # Extract error message
            grep -E "Error:|Exception:|Traceback" "$log_file" | head -n 10 > "../reports/real_data_tests/${test_name}_error.txt"
            notes=$(head -n 1 "../reports/real_data_tests/${test_name}_error.txt" | cut -c 1-50)
            if [ -z "$notes" ]; then
              notes="See log for details"
            else
              notes="${notes}..."
            fi
          fi

          # Calculate duration
          end_time=$(date +%s)
          duration=$((end_time - start_time))

          # Add to summary table
          echo "| $test_name | $status | ${duration}s | $notes |" >> ../reports/real_data_tests/summary.md
        done

        # Return to original directory
        cd ..

        # Add to GitHub step summary
        cat reports/real_data_tests/summary.md >> $GITHUB_STEP_SUMMARY

        # Check if any tests failed
        if grep -q "❌ Failed" reports/real_data_tests/summary.md; then
          echo "::warning::Some real data tests failed. Check the logs for details."
        fi

    - name: Upload real data test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: real-data-reports-${{ matrix.python-version }}-${{ github.run_id }}
        path: reports/real_data_tests

    - name: Upload health and debug reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: health-debug-reports-${{ matrix.python-version }}-${{ github.run_id }}
        path: |
          reports/health_check
          reports/db_debug

    - name: Build package
      run: |
        pip install build
        python -m build

    - name: Store build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.python-version }}
        path: dist/
        retention-days: 7

  deploy-badges:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/psy-supabase-pkg'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create badge directory
        run: mkdir -p badges

      - name: Download Python 3.8 badges
        uses: actions/download-artifact@v4
        with:
          name: badges-py3.8-${{ github.sha }}
          path: badges

      - name: Download Python 3.10 badges
        uses: actions/download-artifact@v4
        with:
          name: badges-py3.10-${{ github.sha }}
          path: badges

      - name: Create badge README
        run: |
          cat > badges/README.md << EOF
          # Code Quality Badges

          These badges show code quality metrics for the psy_supabase project.

          ## Badges
          - pylint-py3.8.svg: PyLint score for Python 3.8
          - coverage-py3.8.svg: Test coverage for Python 3.8
          - pylint-py3.10.svg: PyLint score for Python 3.10
          - coverage-py3.10.svg: Test coverage for Python 3.10

          Last updated: $(date -u "+%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Display structure of downloaded files
        run: ls -la badges/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          destination_dir: badges
          keep_files: true
